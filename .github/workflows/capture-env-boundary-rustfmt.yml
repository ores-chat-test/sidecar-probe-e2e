name: capture env-boundary rustfmt output

on:
  pull_request:
    paths:
      - 'canary/ores-cli-runtime-env-boundary-module/src/audit/runtime_toml_env_boundary.rs'
      - '.github/workflows/capture-env-boundary-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt

      - name: Materialize deterministic rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canary/rustfmt-output
          cp canary/ores-cli-runtime-env-boundary-module/src/audit/runtime_toml_env_boundary.rs \
            canary/rustfmt-output/runtime_toml_env_boundary.rs
          rustfmt --edition 2024 canary/rustfmt-output/runtime_toml_env_boundary.rs
          git config user.name 'ores-test-rustfmt-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add canary/rustfmt-output/runtime_toml_env_boundary.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(DEN-390): capture env-boundary rustfmt output'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
